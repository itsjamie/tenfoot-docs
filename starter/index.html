<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My TV app</title>
<style>
  /* The set gives the app a 1920x1080 surface. The canvas fills it; the video plane sits under it. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070d; }
  video, canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  video { object-fit: cover; background: #000; }
</style>
</head>
<body>
<!-- No autoplay and no preload: browsing never holds a decoder open. The player screen calls play(). -->
<video id="video" preload="none" muted playsinline></video>
<canvas id="ui"></canvas>
<script type="module" src="./main.ts"></script>
</body>
</html>
